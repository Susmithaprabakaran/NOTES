# Render "Blueprint": in the Render dashboard choose New → Blueprint and
# point it at your GitHub repo. It creates the web service AND the Postgres
# database and wires DATABASE_URL between them.
#
# Free web services do not support persistent disks. Uploaded photos and
# attachments are therefore temporary and may disappear after a redeploy
# or service restart.
services:
  - type: web
    name: ai-notes
    runtime: python
    rootDir: ai-notes-app/ai-notes-app/backend
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: ai-notes-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: AI_PROVIDER
        value: local

databases:
  - name: ai-notes-db
    databaseName: ainotes
    user: ainotes
